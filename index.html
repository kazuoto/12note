<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ランダム音選択アプリ</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 画面（メニュー／音当て／ポジション）の切り替え */
    .screen {
      display: none;
      height: 100%;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      grid-template-columns: 1fr minmax(280px, 40vw);
    }
    .screen.active { display: grid; }

    #menuScreen.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3vh;
    }
    #menuScreen h2 { margin: 0; font-size: clamp(1.1rem, 5vh, 1.8rem); color: #555; }
    .menu-btn {
      width: min(70vw, 420px);
      font-size: clamp(1.1rem, 6vh, 2rem);
      padding: 2vh 12px;
      min-height: 56px;
      color: #333;
    }
    #menuGuess { background-color: #87CEEB; }
    #menuPosition { background-color: #90EE90; }

    .back-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      width: auto;
      min-height: 36px;
      padding: 6px 12px;
      font-size: clamp(0.8rem, 3vh, 1rem);
      background-color: rgba(0, 0, 0, 0.08);
      color: #333;
    }

    /* ポジションモードの表示 */
    .display.col { flex-direction: column; gap: 1vh; }
    .col h1 { font-size: min(38vh, 20vw); }
    .pos-label {
      font-size: min(13vh, 6.5vw);
      line-height: 1.1;
      color: #888;
      white-space: nowrap;
    }
    #posExcludeToggle.active { background-color: #FF8DA1; color: #F5F5F5; }
    #posAutoToggle.active { background-color: #90EE90; color: #F5F5F5; }

    /* 左：音名表示（タップで切り替え） */
    .display {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    h1 {
      font-size: min(45vh, 22vw);
      margin: 0;
      line-height: 1;
    }

    .string-number {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      font-size: min(22vh, 11vw);
      line-height: 1;
      color: #888;
      display: none;
    }

    /* 右：操作パネル */
    .side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2vh;
      padding: 2vh 16px;
      min-height: 0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1vh 6px;
    }

    .fret-display {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      font-size: min(12vh, 6vw);
      line-height: 1;
      color: #888;
      white-space: nowrap;
      display: none;
    }

    button {
      font-size: clamp(0.75rem, 3.6vh, 1.2rem);
      padding: 1vh 6px;
      min-height: 40px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      touch-action: manipulation;
      width: 100%;
    }

    .mode-toggle { background-color: #ddd; color: #333; }

    #modeToggle.active { background-color: #FF8DA1; color: #F5F5F5; }
    #autoToggle.active { background-color: #90EE90; color: #F5F5F5; }
    #stringToggle1.active,
    #stringToggle2.active { background-color: #87CEEB; color: #F5F5F5; }
    #fretToggle.active { background-color: #FFB347; color: #F5F5F5; }

    .progress-bar-container {
      width: 100%;
      height: 16px;
      background-color: #ddd;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background-color: #4CAF50;
      width: 100%;
      transition: width linear;
    }

    .time-buttons {
      display: none;
      justify-content: center;
      gap: 6px;
    }

    .time-buttons button {
      flex: 1;
      width: auto;
      padding: 1vh 4px;
      font-size: clamp(0.8rem, 3.6vh, 1rem);
      border-radius: 6px;
      background-color: #ddd;
      color: #333;
    }

    .time-buttons button.selected {
      background-color: #4CAF50;
      color: white;
    }

    /* 縦画面：上下に積む */
    @media (orientation: portrait) {
      .screen {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      .col h1 { font-size: min(25vh, 36vw); }
      .pos-label { font-size: min(7vh, 10vw); }
      h1 { font-size: min(35vh, 40vw); }
      .string-number { font-size: min(15vh, 18vw); }
      .fret-display { font-size: min(8vh, 12vw); }
      .side { padding: 12px 16px 20px; }
    }
  </style>
</head>
<body>
  <div id="menuScreen" class="screen active">
    <h2>モードを選択</h2>
    <button id="menuGuess" class="menu-btn">音当てモード</button>
    <button id="menuPosition" class="menu-btn">ポジションモード</button>
  </div>

  <div id="guessScreen" class="screen">
  <div class="display" id="display">
    <button id="guessBack" class="back-btn">← 戻る</button>
    <h1 id="note">A</h1>
    <div id="stringNumber" class="string-number">1</div>
    <div id="fretDisplay" class="fret-display"></div>
  </div>

  <div class="side">
    <div class="button-group">
      <button id="modeToggle" class="mode-toggle">♯♭除外 (E)</button>
      <button id="autoToggle" class="mode-toggle">自動切り替え (A)</button>
      <div class="button-grid">
        <button id="stringToggle1" class="mode-toggle">弦 1～6</button>
        <button id="stringToggle2" class="mode-toggle">弦 2～4</button>
      </div>
      <button id="fretToggle" class="mode-toggle">フレット指定 (F)</button>
    </div>
    <div id="progressContainer" class="progress-bar-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="timeButtons" class="time-buttons">
      <button data-time="5000" class="selected">5秒</button>
      <button data-time="10000">10秒</button>
      <button data-time="15000">15秒</button>
      <button data-time="20000">20秒</button>
    </div>
  </div>
  </div>

  <div id="positionScreen" class="screen">
    <div class="display col" id="posDisplay">
      <button id="posBack" class="back-btn">← 戻る</button>
      <div id="posQuality" class="pos-label">メジャー</div>
      <h1 id="posNote">A</h1>
      <div id="posPosition" class="pos-label">ポジション①</div>
    </div>
    <div class="side">
      <div class="button-group">
        <button id="posExcludeToggle" class="mode-toggle">♯♭除外 (E)</button>
        <button id="posAutoToggle" class="mode-toggle">自動切り替え (A)</button>
      </div>
      <div id="posProgressContainer" class="progress-bar-container">
        <div id="posProgressBar" class="progress-bar"></div>
      </div>
      <div id="posTimeButtons" class="time-buttons">
        <button data-time="5000" class="selected">5秒</button>
        <button data-time="10000">10秒</button>
        <button data-time="15000">15秒</button>
        <button data-time="20000">20秒</button>
      </div>
    </div>
  </div>

  <script>
    const allNotes = ["A", "A#", "Bb", "B", "C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G"];
    const simpleNotes = ["A", "B", "C", "D", "E", "F", "G"];
    let excludeSharpsAndFlats = false;
    let isAutoMode = false;
    let isStringMode1 = false;
    let isStringMode2 = false;
    let lastStringNumber = null;
    let isPaused = false;
    let recentNotes = [];
    let progressTimeout = null;
    let remainingTime = 5000;
    let elapsedRatio = 0;
    let wakeLock = null;
    let currentMode = "menu";

    function showScreen(name) {
      currentMode = name;
      ["menu", "guess", "position"].forEach(n => {
        document.getElementById(n + "Screen").classList.toggle("active", n === name);
      });
    }
    let isFretMode = false;
    let lastFret = null;
    const fretRanges = ["1～5F", "5～9F", "9～12F", "12～17F"];

    // 画面スリープ防止（自動切り替え中のみ）
    async function requestWakeLock() {
      if (!("wakeLock" in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch (err) {
        console.warn("Wake Lock取得失敗:", err);
      }
    }

    async function releaseWakeLock() {
      if (wakeLock) {
        try { await wakeLock.release(); } catch (err) {}
        wakeLock = null;
      }
    }

    // タブを離れるとロックが自動解除されるので、戻ってきたら再取得
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && (isAutoMode || (window.isPosAuto && window.isPosAuto())) && !wakeLock) {
        requestWakeLock();
      }
    });

    const noteDisplay = document.getElementById("note");
    const displayArea = document.getElementById("display");
    const stringDisplay = document.getElementById("stringNumber");
    const modeToggle = document.getElementById("modeToggle");
    const autoToggle = document.getElementById("autoToggle");
    const stringToggle1 = document.getElementById("stringToggle1");
    const stringToggle2 = document.getElementById("stringToggle2");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const timeButtonsContainer = document.getElementById("timeButtons");
    const timeButtons = document.querySelectorAll("#timeButtons button");
    const fretDisplay = document.getElementById("fretDisplay");
    const fretToggle = document.getElementById("fretToggle");

    function getRandomNote() {
      const notes = excludeSharpsAndFlats ? simpleNotes : allNotes;
      let newNote;
      do {
        newNote = notes[Math.floor(Math.random() * notes.length)];
      } while (recentNotes.includes(newNote));
      recentNotes.push(newNote);
      if (recentNotes.length > 2) recentNotes.shift();
      return newNote;
    }

    function getRandomString(range) {
      let newStringNumber;
      do {
        if (range === "1-6") {
          newStringNumber = Math.floor(Math.random() * 6) + 1;
        } else if (range === "2-4") {
          newStringNumber = Math.floor(Math.random() * 3) + 2;
        }
      } while (newStringNumber === lastStringNumber);
      lastStringNumber = newStringNumber;
      return newStringNumber;
    }

    function changeNote() {
      noteDisplay.textContent = getRandomNote();
      updateStringDisplay();
      updateFretDisplay();
      resetProgressBar();
    }

    function updateStringDisplay() {
      if (isStringMode1) {
        stringDisplay.textContent = getRandomString("1-6");
        stringDisplay.style.display = "block";
      } else if (isStringMode2) {
        stringDisplay.textContent = getRandomString("2-4");
        stringDisplay.style.display = "block";
      } else {
        stringDisplay.style.display = "none";
      }
    }

    function getRandomFret() {
      let newFret;
      do {
        newFret = fretRanges[Math.floor(Math.random() * fretRanges.length)];
      } while (newFret === lastFret);
      lastFret = newFret;
      return newFret;
    }

    function updateFretDisplay() {
      if (isFretMode) {
        fretDisplay.textContent = getRandomFret();
        fretDisplay.style.display = "block";
      } else {
        fretDisplay.style.display = "none";
      }
    }

    function toggleFretMode() {
      isFretMode = !isFretMode;
      fretToggle.classList.toggle("active", isFretMode);
      updateFretDisplay();
    }

    function toggleStringMode1() {
      isStringMode1 = !isStringMode1;
      if (isStringMode1) isStringMode2 = false; // 排他
      updateStringToggleButtons();
      updateStringDisplay();
    }

    function toggleStringMode2() {
      isStringMode2 = !isStringMode2;
      if (isStringMode2) isStringMode1 = false; // 排他
      updateStringToggleButtons();
      updateStringDisplay();
    }

    function updateStringToggleButtons() {
      stringToggle1.classList.toggle("active", isStringMode1);
      stringToggle2.classList.toggle("active", isStringMode2);
    }

    function toggleExcludeMode() {
      excludeSharpsAndFlats = !excludeSharpsAndFlats;
      modeToggle.classList.toggle("active", excludeSharpsAndFlats);
    }

    function toggleAutoMode() {
      isAutoMode = !isAutoMode;
      autoToggle.classList.toggle("active", isAutoMode);
      if (isAutoMode) startAutoMode();
      else stopAutoMode();
    }

    function startAutoMode() {
      isPaused = false;
      elapsedRatio = 0;
      progressContainer.style.display = "block";
      timeButtonsContainer.style.display = "flex";
      requestWakeLock();
      changeNote();
    }

    function stopAutoMode() {
      clearTimeout(progressTimeout);
      isPaused = false;
      progressContainer.style.display = "none";
      timeButtonsContainer.style.display = "none";
      releaseWakeLock();
    }

    function resetProgressBar() {
      clearTimeout(progressTimeout);
      if (!isAutoMode || isPaused) return; // 手動モードではタイマーを動かさない
      progressBar.style.transition = "none";
      progressBar.style.width = "100%";
      setTimeout(() => {
        if (!isAutoMode || isPaused) return; // 50ms待つ間に停止/一時停止された場合
        progressBar.style.transition = `width ${remainingTime}ms linear`;
        progressBar.style.width = "0%";
        progressTimeout = setTimeout(changeNote, remainingTime);
      }, 50);
    }

    function pauseProgressBar() {
      clearTimeout(progressTimeout);
      const computedStyle = window.getComputedStyle(progressBar);
      const currentWidth = parseFloat(computedStyle.width);
      const totalWidth = parseFloat(progressContainer.offsetWidth);
      elapsedRatio = 1 - currentWidth / totalWidth;
      progressBar.style.transition = "none";
      progressBar.style.width = `${currentWidth}px`;
      isPaused = true;
    }

    function resumeProgressBar() {
      isPaused = false;
      const remainingTimeAdjusted = remainingTime * (1 - elapsedRatio);
      progressBar.style.transition = `width ${remainingTimeAdjusted}ms linear`;
      progressBar.style.width = "0%";
      progressTimeout = setTimeout(changeNote, remainingTimeAdjusted);
    }

    // スペースキー／画面タップ共通の動作
    function handleMainAction() {
      if (isAutoMode) {
        if (isPaused) resumeProgressBar();
        else pauseProgressBar();
      } else {
        changeNote();
      }
    }

    function handleArrowKeyNavigation(direction) {
      const selectedButton = document.querySelector(".time-buttons button.selected");
      const buttonsArray = Array.from(timeButtons);
      const currentIndex = buttonsArray.indexOf(selectedButton);
      let newIndex = currentIndex + direction;

      if (newIndex < 0) newIndex = buttonsArray.length - 1;
      if (newIndex >= buttonsArray.length) newIndex = 0;

      timeButtons.forEach(btn => btn.classList.remove("selected"));
      buttonsArray[newIndex].classList.add("selected");
      remainingTime = parseInt(buttonsArray[newIndex].dataset.time);
      if (isAutoMode && !isPaused) resetProgressBar();
    }

    timeButtons.forEach(button => {
      button.addEventListener("click", () => {
        timeButtons.forEach(btn => btn.classList.remove("selected"));
        button.classList.add("selected");
        remainingTime = parseInt(button.dataset.time);
        if (isAutoMode && !isPaused) resetProgressBar();
      });
    });

    // 音名エリアをタップ：手動モードなら次の音、自動モードなら一時停止/再開
    displayArea.addEventListener("click", handleMainAction);

    modeToggle.addEventListener("click", (e) => {
      e.preventDefault();
      toggleExcludeMode();
      modeToggle.blur();
    });

    autoToggle.addEventListener("click", (e) => {
      e.preventDefault();
      toggleAutoMode();
      autoToggle.blur();
    });

    stringToggle1.addEventListener("click", (e) => {
      e.preventDefault();
      toggleStringMode1();
      stringToggle1.blur();
    });

    stringToggle2.addEventListener("click", (e) => {
      e.preventDefault();
      toggleStringMode2();
      stringToggle2.blur();
    });

    fretToggle.addEventListener("click", (e) => {
      e.preventDefault();
      toggleFretMode();
      fretToggle.blur();
    });

    document.addEventListener("keydown", (event) => {
      if (currentMode !== "guess") return;
      if (event.code === "Space") {
        event.preventDefault();
        handleMainAction();
      } else if (event.code === "KeyE") {
        toggleExcludeMode();
      } else if (event.code === "KeyA") {
        toggleAutoMode();
      } else if (event.code === "KeyS") {
        toggleStringMode1();
      } else if (event.code === "KeyZ") {
        toggleStringMode2();
      } else if (event.code === "KeyF") {
        toggleFretMode();
      } else if (event.code === "ArrowRight") {
        handleArrowKeyNavigation(1);
      } else if (event.code === "ArrowLeft") {
        handleArrowKeyNavigation(-1);
      }
    });

    // ===== モード選択・戻るボタン =====
    document.getElementById("menuGuess").addEventListener("click", () => showScreen("guess"));
    document.getElementById("menuPosition").addEventListener("click", () => {
      showScreen("position");
      window.posEnter();
    });
    document.getElementById("guessBack").addEventListener("click", (e) => {
      e.stopPropagation();
      if (isAutoMode) toggleAutoMode();
      showScreen("menu");
    });

    // ===== ポジションモード =====
    (function () {
      const qualities = ["メジャー", "マイナー"];
      const positions = ["ポジション①", "ポジション②"];
      let exclude = false, auto = false, paused = false, timer = null;
      let remaining = 5000, elapsed = 0, recent = [];
      const $ = (id) => document.getElementById(id);
      const note = $("posNote"), quality = $("posQuality"), position = $("posPosition");
      const excludeBtn = $("posExcludeToggle"), autoBtn = $("posAutoToggle");
      const bar = $("posProgressBar"), barBox = $("posProgressContainer"), timeBox = $("posTimeButtons");
      const timeBtns = Array.from(timeBox.querySelectorAll("button"));
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      function randomNote() {
        const notes = exclude ? simpleNotes : allNotes;
        let n;
        do { n = pick(notes); } while (recent.includes(n));
        recent.push(n);
        if (recent.length > 2) recent.shift();
        return n;
      }

      function change() {
        note.textContent = randomNote();
        quality.textContent = pick(qualities);
        position.textContent = pick(positions);
        resetBar();
      }

      function resetBar() {
        clearTimeout(timer);
        if (!auto || paused) return;
        bar.style.transition = "none";
        bar.style.width = "100%";
        timer = setTimeout(() => {
          bar.style.transition = `width ${remaining}ms linear`;
          bar.style.width = "0%";
          timer = setTimeout(change, remaining);
        }, 50);
      }

      function pause() {
        clearTimeout(timer);
        const w = parseFloat(getComputedStyle(bar).width);
        elapsed = 1 - w / barBox.offsetWidth;
        bar.style.transition = "none";
        bar.style.width = w + "px";
        paused = true;
      }

      function resume() {
        paused = false;
        const t = remaining * (1 - elapsed);
        bar.style.transition = `width ${t}ms linear`;
        bar.style.width = "0%";
        timer = setTimeout(change, t);
      }

      function mainAction() {
        if (auto) { paused ? resume() : pause(); }
        else change();
      }

      function setAuto(on) {
        auto = on;
        autoBtn.classList.toggle("active", on);
        if (on) {
          paused = false;
          elapsed = 0;
          barBox.style.display = "block";
          timeBox.style.display = "flex";
          requestWakeLock();
          change();
        } else {
          clearTimeout(timer);
          paused = false;
          barBox.style.display = "none";
          timeBox.style.display = "none";
          releaseWakeLock();
        }
      }

      function toggleExclude() {
        exclude = !exclude;
        excludeBtn.classList.toggle("active", exclude);
      }

      function selectTime(btn) {
        timeBtns.forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        remaining = parseInt(btn.dataset.time);
        if (auto && !paused) resetBar();
      }

      function navTime(dir) {
        const i = timeBtns.findIndex(b => b.classList.contains("selected"));
        selectTime(timeBtns[(i + dir + timeBtns.length) % timeBtns.length]);
      }

      timeBtns.forEach(btn => btn.addEventListener("click", () => selectTime(btn)));
      $("posDisplay").addEventListener("click", mainAction);
      excludeBtn.addEventListener("click", (e) => { e.preventDefault(); toggleExclude(); excludeBtn.blur(); });
      autoBtn.addEventListener("click", (e) => { e.preventDefault(); setAuto(!auto); autoBtn.blur(); });
      $("posBack").addEventListener("click", (e) => {
        e.stopPropagation();
        setAuto(false);
        showScreen("menu");
      });

      document.addEventListener("keydown", (e) => {
        if (currentMode !== "position") return;
        if (e.code === "Space") { e.preventDefault(); mainAction(); }
        else if (e.code === "KeyE") toggleExclude();
        else if (e.code === "KeyA") setAuto(!auto);
        else if (e.code === "ArrowRight") navTime(1);
        else if (e.code === "ArrowLeft") navTime(-1);
      });

      window.isPosAuto = () => auto;
      window.posEnter = change;
    })();
  </script>
</body>
</html>
